<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="manifest.json">
<title>EFW Calculator</title>
<style>
body{font-family:Arial,sans-serif;background:#f5f5f5;margin:0;padding:16px}
.card{max-width:520px;margin:auto;background:#fff;border-radius:14px;padding:20px;box-shadow:0 2px 10px rgba(0,0,0,.12)}
h1{font-size:24px;margin:0 0 8px} label{display:block;font-weight:bold;margin-top:14px}
input{width:100%;box-sizing:border-box;font-size:20px;padding:12px;margin-top:5px;border:1px solid #aaa;border-radius:8px}
button{width:100%;font-size:20px;font-weight:bold;padding:14px;margin-top:18px;border:0;border-radius:8px}
.result{margin-top:20px;padding:16px;border-radius:10px;background:#eee;text-align:center}
.efw{font-size:32px;font-weight:bold;margin:8px 0}.line{font-size:18px;margin:8px 0}
.note{font-size:13px;line-height:1.5;color:#555;margin-top:18px}.error{font-size:15px;margin-top:10px}
</style>
</head>
<body>
<div class="card">
<h1>Fetal Weight Calculator</h1>
<div>Enter measurements in <b>mm</b>.</div>
<label>Gestational age (weeks)</label><input id="ga" type="number" step="0.1" inputmode="decimal">
<label>HC (mm)</label><input id="hc" type="number" step="0.1" inputmode="decimal">
<label>AC (mm)</label><input id="ac" type="number" step="0.1" inputmode="decimal">
<label>FL (mm)</label><input id="fl" type="number" step="0.1" inputmode="decimal">
<button id="calc" type="button">CALCULATE</button>
<button id="clear" type="button">CLEAR</button>
<div class="result">
<div>Estimated Fetal Weight</div><div class="efw" id="efw">— g</div>
<div class="line">Percentile: <b id="pct">—</b></div>
<div class="line" id="assessment">—</div><div class="error" id="error"></div>
</div>
<div class="note">For trained users. EFW is an estimate and should be interpreted with an appropriate gestational-age reference chart. This tool supports clinical assessment and is not intended for definitive diagnosis.</div>
</div>
<script>
function v(id){return parseFloat(document.getElementById(id).value)}
function err(t){document.getElementById("error").textContent=t||""}
function calc(){
 err("");
 var ga=v("ga"),hc=v("hc")/10,ac=v("ac")/10,fl=v("fl")/10;
 if(!isFinite(ga)||ga<22||ga>40){err("Please enter gestational age from 22 to 40 weeks.");return}
 if(!isFinite(hc)||!isFinite(ac)||!isFinite(fl)||hc<=0||ac<=0||fl<=0){err("Please enter HC, AC and FL.");return}
 var log10=1.326-0.00326*ac*fl+0.0107*hc+0.0438*ac+0.158*fl;
 var efw=Math.pow(10,log10);
 document.getElementById("efw").textContent=Math.round(efw)+" g";
 document.getElementById("pct").textContent="—";
 document.getElementById("assessment").textContent="EFW calculated — percentile reference chart required.";
}
function clearAll(){["ga","hc","ac","fl"].forEach(function(x){document.getElementById(x).value=""});document.getElementById("efw").textContent="— g";document.getElementById("pct").textContent="—";document.getElementById("assessment").textContent="—";err("")}
document.getElementById("calc").onclick=calc;document.getElementById("clear").onclick=clearAll;
if("serviceWorker" in navigator){navigator.serviceWorker.register("sw.js").catch(function(){})}
</script>
</body></html>
